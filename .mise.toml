[tools]
actionlint = "1.7.12"
hk = "1.57.0"
pkl = "0.32.1"
rust = { version = "1.98.0", components = "rustfmt,clippy" }
rumdl = "0.2.63"
tombi = "1.5.0"
yamlfmt = "0.21.0"
yamllint = "1.38.0"

[tasks.check]
description = "Run all checks"
run = "hk check --all"

[tasks.fix]
description = "Fix all issues"
run = "hk fix --all"

[tasks.test]
description = "Run tests"
run = "cargo test"
